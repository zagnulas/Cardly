function found(r){navigator.vibrate&&navigator.vibrate(60);go('form',{id:null,draft:{merchantName:'',cardName:'',barcodeValue:r.rawValue,barcodeType:TYPES[r.format]?r.format:'code_128',color:COL[0],icon:ICO[0],isFavorite:false,image:null,auto:false}})}
async function fromPhoto(f){
 if(!f)return;const draft={merchantName:'',cardName:'',barcodeValue:'',barcodeType:'code_128',color:COL[0],icon:ICO[0],isFavorite:false,image:null};
 try{if('BarcodeDetector' in window){const bm=await createImageBitmap(f);const r=await new BarcodeDetector({formats:Object.keys(TYPES)}).detect(bm);
 if(r.length){draft.barcodeValue=r[0].rawValue;draft.barcodeType=r[0].format;draft.auto=false;toast('Barkodas rastas')}else toast('Barkodo neradome – įveskite numerį')}else toast('Įveskite numerį ranka')}catch(e){toast('Nepavyko nuskaityti nuotraukos')}
 go('form',{id:null,draft})}
function loadImg(f){return new Promise(ok=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ok(null);i.src=r.result};r.onerror=()=>ok(null);r.readAsDataURL(f)})}
async function fromLogo(f){if(!f)return;readForm();const im=await loadImg(f);if(!im){toast('Nepavyko nuskaityti paveikslėlio');return}
 const n=160,c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d'),m=Math.min(im.width,im.height);
 x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,n,n);S.draft.image=c.toDataURL('image/png');render()}
function pvHtml(d){return d.useShot&&d.shot?`<img src="${d.shot}" alt="" style="max-width:100%;max-height:170px">`:(d.barcodeValue?bcSvg(d.barcodeValue,d.barcodeType,80):'<small>Peržiūra atsiras čia</small>')}
async function fromShot(f){
 if(!f)return;const inForm=S.view==='form';if(inForm)readForm();
 const d=inForm?S.draft:{merchantName:'',cardName:'',barcodeValue:'',barcodeType:'code_128',color:COL[0],icon:ICO[0],isFavorite:false,image:null,auto:true};
 const im=await loadImg(f);
 if(!im){toast('Nepavyko nuskaityti nuotraukos');return}
 const draw=m=>{const k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c};
 const big=draw(1600);let hit=null;
 try{if('BarcodeDetector' in window){const r=await new BarcodeDetector({formats:Object.keys(TYPES)}).detect(big);if(r.length)hit={v:r[0].rawValue,t:r[0].format}}}catch(e){}
 if(!hit&&typeof jsQR==='function'){const x=big.getContext('2d').getImageData(0,0,big.width,big.height),q=jsQR(x.data,x.width,x.height,{inversionAttempts:'attemptBoth'});if(q)hit={v:q.data,t:'qr_code'}}
 d.shot=draw(1200).toDataURL('image/jpeg',.85);
 if(hit){d.barcodeValue=hit.v;d.barcodeType=TYPES[hit.t]?hit.t:'qr_code';d.auto=false;d.useShot=false;toast('Kodas atpažintas')}
 else{d.useShot=true;toast('Kodo neatpažinau – rodysiu nuotrauką')}
 go('form',{id:inForm?S.id:null,draft:d})}
async function importJson(f){if(!f)return;try{const a=JSON.parse(await f.text());if(!Array.isArray(a))throw 0;const ids=new Set(S.cards.map(c=>c.id));let n=0;
 for(const c of a){if(c&&c.merchantName&&(c.barcodeValue||c.shot)&&!ids.has(c.id)){S.cards.push({...c,id:c.id||'c'+Date.now().toString(36)+n});n++}}
 save();render();toast(T('Importuota kortelių: ')+n)}catch(e){toast('Netinkamas failas')}}
function readForm(){const d=S.draft;d.cardName=$('#fc').value.trim();d.merchantName=d.cardName;d.barcodeValue=$('#fv').value.trim();d.barcodeType=$('#ft').value}
function gsOk(v){let t=0;const n=v.length;for(let i=0;i<n-1;i++)t+=+v[n-2-i]*(i%2?1:3);return (10-t%10)%10==+v[n-1]}
function guess(v){if(/^\d+$/.test(v)&&[8,12,13].includes(v.length)&&gsOk(v))return {8:'ean_8',12:'upc_a',13:'ean_13'}[v.length];return 'code_128'}
function upPrev(){readForm();if(S.draft.auto!==false&&S.draft.barcodeValue){S.draft.barcodeType=guess(S.draft.barcodeValue);$('#ft').value=S.draft.barcodeType}$('#pv').innerHTML=pvHtml(S.draft);tr($('#pv'))}
function del(id){if(confirm(T('Ištrinti šią kortelę?'))){S.cards=S.cards.filter(c=>c.id!==id);save();wake(false);go('home',{tab:'home',id:null});toast('Ištrinta')}}
document.addEventListener('click',e=>{
 const t=e.target.closest('button,[data-fav],[data-open]');if(!t)return;const D=t.dataset;
 if(D.fav){e.stopPropagation();const c=S.cards.find(x=>x.id===D.fav);c.isFavorite=!c.isFavorite;save();render();return}
 if(D.open){go('card',{id:D.open});return}
 if(D.lang){S.lang=D.lang;save();render();return}
 if(D.next!==undefined){if((S.ob_i||0)<1){S.ob_i=(S.ob_i||0)+1;render()}else{S.ob=true;save();navigator.mediaDevices&&navigator.mediaDevices.getUserMedia({video:true}).then(s=>s.getTracks().forEach(x=>x.stop())).catch(()=>{});render()}return}
 if(D.skip!==undefined){S.ob=true;save();render();return}
 if(D.tab){S.tab=D.tab;S.view=D.tab;render();return}
 if(D.go){if(D.go==='form'){S.id=null;S.draft=null}go(D.go);return}
 if(D.cancel!==undefined){const ed=!!S.id,v=S.view;S.draft=null;S.id=null;if(!ed&&(v==='form'||v==='scan')){go('add',{tab:'add'})}else go(S.tab==='add'?'home':S.tab,{tab:S.tab==='add'?'home':S.tab});return}
 if(D.close!==undefined){wake(false);go(S.tab==='add'?'home':S.tab,{id:null});return}
 if(D.bright!==undefined){$('#fs').classList.toggle('hide');toast('Bakstelėkite ekraną, kad grąžintumėte mygtukus');return}
 if(D.edit){const c=S.cards.find(x=>x.id===D.edit);wake(false);go('form',{id:c.id,draft:{...c,cardName:c.merchantName||c.cardName,auto:false}});return}
 if(D.del){del(D.del);return}
 if(D.mv){const i=S.cards.findIndex(c=>c.id===S.id),j=i+ +D.mv;if(j>=0&&j<S.cards.length){[S.cards[i],S.cards[j]]=[S.cards[j],S.cards[i]];save();toast('Perkelta')}return}
 if(D.rmimg!==undefined){readForm();S.draft.image=null;render();return}
 if(D.rmshot!==undefined){readForm();S.draft.shot=null;S.draft.useShot=false;render();return}
 if(D.imp!==undefined){$('#imp').click();return}
 if(D.fopen!==undefined){S.fo=!S.fo;render();return}
 if(D.fc!==undefined){S.fc=D.fc||null;render();return}
 if(D.pick){$('#'+D.pick).click();return}
 if(D.c){readForm();S.draft.color=D.c;render();return}
 if(D.i){readForm();S.draft.icon=D.i;S.draft.image=null;render();return}
 if(D.theme){S.theme=D.theme;setTheme();save();render();return}
 if(D.exp!==undefined){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S.cards,null,1)],{type:'application/json'}));a.download='kortos.json';a.click();return}
 if(D.clr!==undefined){if(confirm(T('Ištrinti VISAS korteles?'))){S.cards=[];save();render()}return}
 if(D.ob!==undefined){S.ob=false;S.ob_i=0;render();return}
 if(t.id==='sv'){readForm();const d=S.draft;
  if(!d.cardName){toast('Įveskite kortelės pavadinimą');return}
  if(!d.barcodeValue&&!d.shot){toast('Įveskite numerį arba įkelkite nuotrauką');return}
  const now=Date.now();
  if(S.id){Object.assign(S.cards.find(c=>c.id===S.id),d,{updatedAt:now})}
  else S.cards.unshift({...d,id:'c'+now.toString(36)+Math.random().toString(36).slice(2,6),cardName:d.cardName,createdAt:now,updatedAt:now});
  save();S.draft=null;S.id=null;S.tab='home';go('home');toast('Kortelė išsaugota')}
});
document.addEventListener('click',e=>{const f=$('#fs');if(f&&f.classList.contains('hide')&&!e.target.closest('button'))f.classList.remove('hide')});
document.addEventListener('input',e=>{
 if(e.target.id==='q'){S.q=e.target.value;const p=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(p,p)}
 if(e.target.id==='ft'){S.draft.auto=false}if(['fv','ft'].includes(e.target.id)){upPrev();const d=S.draft;if(e.target.id==='fv'&&d.shot&&d.useShot&&!d.usSet&&d.barcodeValue){d.useShot=false;const u=$('#us');if(u)u.checked=false;upPrev()}}});
document.addEventListener('change',e=>{if(e.target.id==='us'){readForm();S.draft.usSet=true;S.draft.useShot=e.target.checked;render()}if(e.target.id==='sh'){fromShot(e.target.files[0]);e.target.value=''}if(e.target.id==='imp'){importJson(e.target.files[0]);e.target.value=''}if(e.target.id==='im')fromLogo(e.target.files[0]);if(e.target.id==='ph'){fromShot(e.target.files[0]);e.target.value=''}if(e.target.id==='ft'){S.draft.auto=false;upPrev()}});
if(HW.on&&Date.now()<Date.parse(HW.until))document.body.classList.add('hw');load();setTheme();render();if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});

</script></body></html>
