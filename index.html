<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#EEF2FA;--fg:#0B1220;--mut:#5F6B85;--glass:rgba(255,255,255,.78);--glass2:rgba(255,255,255,.95);--ln:rgba(15,30,70,.10);--ac:#2F6BFF;--ac2:#14B8D4;--on:#fff;--sh:0 12px 30px -14px rgba(30,60,130,.28);--grad:linear-gradient(135deg,#3F6DFF,#22B8EE);--card:var(--glass)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#05070F;--fg:#F4F6FF;--mut:#A6AEC5;--glass:rgba(255,255,255,.085);--glass2:rgba(255,255,255,.14);--ln:rgba(255,255,255,.17);--ac:#5B8CFF;--ac2:#22D3EE;--sh:0 14px 36px -16px rgba(0,0,0,.75);--navbg:rgba(18,20,38,.84)}}
:root[data-theme=dark]{--bg:#05070F;--fg:#F4F6FF;--mut:#A6AEC5;--glass:rgba(255,255,255,.085);--glass2:rgba(255,255,255,.14);--ln:rgba(255,255,255,.17);--ac:#5B8CFF;--ac2:#22D3EE;--sh:0 14px 36px -16px rgba(0,0,0,.75);--navbg:rgba(18,20,38,.84)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:400 16px/1.4 'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(70% 42% at 50% 30%,rgba(63,109,255,.17),transparent 72%),radial-gradient(55% 34% at 100% 100%,rgba(139,108,255,.10),transparent 72%)}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:auto}
main{flex:1;overflow:auto;padding:12px 18px 24px}main::-webkit-scrollbar{display:none}
h1{font-size:30px;font-weight:700;letter-spacing:-.03em;margin:8px 0 18px}
h2{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:22px 0 10px}
button{font:inherit;font-size:15px;font-weight:600;color:inherit;cursor:pointer;min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--ln);background:var(--glass);transition:transform .18s cubic-bezier(.2,.8,.2,1),background .2s,box-shadow .2s,border-color .2s}
button:active{transform:scale(.97)}button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pri{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 10px 26px -10px rgba(59,108,255,.8),inset 0 1px 0 rgba(255,255,255,.3)}
.dng{color:#FF6B7A}
input,select{font:inherit;font-size:16px;width:100%;min-height:50px;padding:0 16px;border-radius:14px;border:1px solid var(--ln);background:var(--glass);color:var(--fg);margin-bottom:10px;transition:border-color .2s,box-shadow .2s}
input::placeholder{color:var(--mut)}
input:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 4px rgba(91,140,255,.18)}
.row{display:flex;gap:10px}.row>*{flex:1}.grid{display:grid;gap:10px}
.sb{display:flex;gap:10px;margin-bottom:12px}
.sb input{margin:0;flex:1;min-width:0;padding-left:44px;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2024%2024%27%20fill%3D%27none%27%20stroke%3D%27%23B4BCD2%27%20stroke-width%3D%272%27%20stroke-linecap%3D%27round%27%3E%3Ccircle%20cx%3D%2711%27%20cy%3D%2711%27%20r%3D%277%27%2F%3E%3Cpath%20d%3D%27M20%2020l-3.5-3.5%27%2F%3E%3C%2Fsvg%3E");background-repeat:no-repeat;background-position:15px center;background-size:18px}
.fb{flex:none;width:50px;min-height:50px;padding:0;display:flex;align-items:center;justify-content:center;position:relative}
.fb.on{background:var(--grad);color:#fff;border-color:transparent}
.fb i{position:absolute;right:8px;top:8px;width:10px;height:10px;border-radius:50%;border:2px solid #fff}
.chips{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.chips button{width:36px;height:36px;min-height:0;padding:0;border-radius:50%;border:0}
.chips button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ac)}
.chips .clr{width:auto;padding:0 14px;border-radius:12px;font-size:13px;border:1px solid var(--ln)}
.tile{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:10px 6px 10px 12px;border-radius:20px;text-align:left;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),var(--sh)}
.tile:active{background:var(--glass2)}
.tile .ic{flex:none;width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;color:#fff;background:var(--c);background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 45%,#000));box-shadow:0 6px 16px -6px var(--c),inset 0 1px 0 rgba(255,255,255,.35)}
.tile .ic img{width:100%;height:100%;object-fit:cover}
.tile .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:16px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{font-size:12px;font-weight:500;color:var(--mut);font-variant-numeric:tabular-nums;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .fv{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--mut)}.tile .fv.on{color:#FFC857}
.opt{display:flex;align-items:center;justify-content:flex-start;gap:14px;min-height:64px;padding:0 14px;text-align:left;font-size:16px;border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),var(--sh)}
.opt::after{content:'›';margin-left:auto;font-size:22px;color:var(--mut)}
.opt .oi{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none;background:rgba(91,140,255,.14);color:var(--ac)}
.opt.pri{background:linear-gradient(135deg,rgba(63,109,255,.30),rgba(34,184,238,.14));border-color:rgba(91,140,255,.45);color:var(--fg);box-shadow:0 14px 34px -18px rgba(59,108,255,.9),inset 0 1px 0 rgba(255,255,255,.12)}
.opt.pri .oi{background:var(--grad);color:#fff}
nav{display:flex;align-items:center;margin:0 14px 10px;padding:6px;border-radius:26px;background:var(--glass);border:1px solid var(--ln);-webkit-backdrop-filter:blur(24px) saturate(1.5);backdrop-filter:blur(24px) saturate(1.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 18px 44px -16px rgba(0,0,0,.6)}
nav button{flex:1;min-height:54px;padding:0;border:0;background:none;color:var(--mut);font-size:11px;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;border-radius:20px}
nav button.on{color:var(--fg);background:rgba(91,140,255,.16)}nav button.on i{color:var(--ac)}
nav i{display:flex;font-style:normal}
nav .plus{flex:0 0 58px;min-height:0;height:50px;margin:0 6px;border-radius:18px;background:var(--grad);color:#fff;box-shadow:0 10px 24px -8px rgba(59,108,255,.85),inset 0 1px 0 rgba(255,255,255,.35)}
.empty{text-align:center;color:var(--mut);padding:56px 20px}
.sw{display:flex;gap:12px;flex-wrap:wrap;margin:4px 0 14px}
.sw button{width:40px;height:40px;min-height:0;padding:0;border-radius:50%;border:0}.sw button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg)}
.sw.ics button{background:var(--glass);border:1px solid var(--ln);border-radius:12px;font-size:20px}.sw.ics button.on{border-color:var(--ac);box-shadow:0 0 0 3px rgba(91,140,255,.25)}
.th{width:64px;height:64px;border-radius:16px;object-fit:cover;margin-bottom:10px;display:block}
.chk{display:flex;gap:12px;align-items:center;margin-bottom:12px}.chk input{width:24px;min-height:24px;margin:0;accent-color:var(--ac)}
.adv{margin-bottom:12px;border:1px solid var(--ln);border-radius:16px;padding:0 14px;background:var(--glass)}
.adv summary{min-height:50px;display:flex;align-items:center;color:var(--mut);font-weight:600;cursor:pointer;list-style:none}.adv summary::-webkit-details-marker{display:none}
.adv summary::after{content:'+';margin-left:auto;font-size:20px}.adv[open] summary::after{content:'–'}
.adv p{color:var(--mut);font-size:14px;margin:0 0 10px}
.prev{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;text-align:center;color:#000;box-shadow:var(--sh)}.prev svg{max-width:100%;height:90px}
.ad{display:block;position:relative;margin:0 0 14px;overflow:hidden;border-radius:18px;border:1px solid var(--ln);background:var(--glass);color:var(--fg);text-decoration:none}
.ad img{width:100%;height:76px;object-fit:cover;display:block}.ad .tx2{display:flex;align-items:center;justify-content:center;min-height:64px;padding:10px 44px;text-align:center;font-weight:600}
.ad small{position:absolute;top:8px;left:8px;font-size:10px;padding:2px 8px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff;letter-spacing:.04em}
.full{position:fixed;inset:0;background:#fff;color:#0B1220;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:9;animation:up .32s cubic-bezier(.2,.8,.2,1)}
.full svg{width:100%;max-width:520px;height:auto;max-height:58vh}.full img.shot{max-width:100%;max-height:64vh;object-fit:contain}
.full .bar{position:absolute;bottom:0;left:0;right:0;display:flex;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.full .bar button{flex:1;background:#F0F2F7;color:#0B1220;border:0}
.full .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;width:44px;min-height:0;height:44px;padding:0;border-radius:50%;background:#F0F2F7;color:#0B1220;border:0;font-size:18px}
.full.hide .bar,.full.hide .x{display:none}
.scan{position:fixed;inset:0;background:#000;z-index:8;display:flex;flex-direction:column}
.scan video{flex:1;object-fit:cover;width:100%}
.scan .fr{position:absolute;left:10%;right:10%;top:30%;height:26%;border-radius:24px;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 0 999px rgba(5,7,15,.62);overflow:hidden}
.scan .fr::after{content:'';position:absolute;left:8%;right:8%;top:0;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#22D3EE,transparent);box-shadow:0 0 14px #22D3EE;animation:sl 2s ease-in-out infinite alternate}
.scan .bar{position:absolute;bottom:0;left:0;right:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.scan .bar button{flex:1;background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);color:#fff;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);padding:11px 18px;border-radius:16px;background:var(--fg);color:var(--bg);font-size:14px;font-weight:500;z-index:20;box-shadow:var(--sh);max-width:90%;text-align:center;animation:fade .25s}
.ob{display:flex;flex-direction:column;justify-content:center;height:100%;padding:32px;gap:16px;text-align:center}
.ob .big{width:112px;height:112px;margin:0 auto 8px;border-radius:34px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--grad);box-shadow:0 24px 60px -18px rgba(59,108,255,.75),inset 0 1px 0 rgba(255,255,255,.35)}
.ob h1{font-size:30px;margin:0}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0}.dots i{width:7px;height:7px;border-radius:7px;background:rgba(138,147,171,.4);transition:width .3s}.dots i.on{width:24px;background:var(--ac)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(30px);opacity:0}}@keyframes sl{to{top:calc(100% - 2px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* wallet depth */
.deck{position:relative;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin:4px -18px 0;padding:10px 7% 26px;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
.deck::-webkit-scrollbar{display:none}
.wc{--d:1;position:relative;flex:0 0 80%;aspect-ratio:1.586;scroll-snap-align:center;scroll-snap-stop:always;border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;cursor:pointer;overflow:hidden;
 background:var(--c);background:radial-gradient(130% 95% at 0% 0%,rgba(255,255,255,.26),transparent 55%),linear-gradient(150deg,color-mix(in srgb,var(--c) 92%,#000),color-mix(in srgb,var(--c) 38%,#000));
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),inset 0 1px 0 rgba(255,255,255,.4),0 26px 38px -20px rgba(0,0,0,.75),0 10px 18px -10px color-mix(in srgb,var(--c) 55%,transparent);
 transform:scale(calc(1 - .1*var(--d)));opacity:calc(1 - .45*var(--d));filter:brightness(calc(1 - .32*var(--d)))}
.wc+.wc{margin-left:-10px}
.wc::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;background:linear-gradient(112deg,transparent 40%,rgba(255,255,255,.14) 50%,transparent 60%) 160% 0/260% 100% no-repeat;transition:opacity .5s}
.wc.on::after{opacity:1;animation:sheen 10s ease-in-out infinite}
@keyframes sheen{0%,50%{background-position:160% 0}100%{background-position:-70% 0}}
.wt{display:flex;align-items:center;justify-content:space-between}
.wl{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:20px;background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}.wl img{width:100%;height:100%;object-fit:cover}
.wc .fv{width:44px;height:44px;margin:-6px -10px -6px 0;display:flex;align-items:center;justify-content:center;font-size:20px;color:rgba(255,255,255,.75)}.wc .fv.on{color:#FFD97A}
.wm{min-width:0}
.wn,.wsub{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wn{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.wsub{font-size:13px;font-weight:500;opacity:.8;margin-top:2px}
.wb{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;letter-spacing:.12em;opacity:.85;font-variant-numeric:tabular-nums}
.cta{width:100%;min-height:56px;font-size:17px;font-weight:600;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 4px;background:linear-gradient(135deg,#4F7BFF,#2E5CEB 55%,#2593E0);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 16px 30px -14px rgba(46,92,235,.85)}
h1{font-size:34px;line-height:1.1;letter-spacing:-.035em;margin:10px 0 20px}
h2{font-size:11px;letter-spacing:.12em;margin:26px 0 12px}
.tile{background-image:linear-gradient(180deg,rgba(255,255,255,.05),transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 12px 24px -16px rgba(0,0,0,.7)}
.tile small{font-size:13px}
input,select{box-shadow:inset 0 1px 3px rgba(0,0,0,.18)}
.full{background:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--c,#3F6DFF) 16%,#fff),#fff 40%)}
@keyframes up{from{transform:translateY(28px) scale(.985);opacity:0}}

/* vertical deck */
.deck{flex-direction:column;overflow-x:hidden;overflow-y:auto;scroll-snap-type:y mandatory;height:min(60vh,540px);padding:0 7%;margin:0 -18px;overscroll-behavior:contain}
.wc{flex:0 0 auto;width:84%;align-self:center}
.wc+.wc{margin-left:0;margin-top:-14px}

/* screenshot cards */
.wbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wc.has::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.4),transparent 38%,rgba(0,0,0,.6))}
.wc>.wt,.wc>.wm,.wc>.wb{position:relative;z-index:1}.wc::after{z-index:2}
.wc.has .wl{visibility:hidden}
.wc.has{box-shadow:0 0 0 1.5px rgba(150,165,205,.65),inset 0 0 0 1px rgba(255,255,255,.3),0 26px 38px -20px rgba(0,0,0,.75)}
.wc.has{box-shadow:0 0 0 2.5px #4F8CFF,0 0 0 6px rgba(79,140,255,.22),inset 0 0 0 1px rgba(255,255,255,.35),0 26px 38px -20px rgba(0,0,0,.75)}
.full .x{width:48px;height:48px;background:#E2E7F3;border:1px solid rgba(15,30,70,.14);color:#0B1220;box-shadow:0 8px 18px -8px rgba(15,30,70,.45),inset 0 1px 0 rgba(255,255,255,.7)}
.full .x svg{width:22px;height:22px;max-width:none;max-height:none;stroke-width:2.8}
.full .bar button{padding:0 8px;white-space:nowrap;font-size:14px}
.back{min-height:40px;padding:0 14px 0 8px;border-radius:99px;display:inline-flex;align-items:center;gap:2px;font-size:15px;margin:0 0 2px -4px;color:var(--ac);background:none;border:0}
/* halloween start */
body.hw{--ac:#FF8A2B;--ac2:#B66DFF;--grad:linear-gradient(135deg,#FF8A2B,#E5481C)}
body.hw::before{background:radial-gradient(90px 90px at 14% 24%,rgba(255,138,43,.16),transparent),radial-gradient(130px 130px at 90% 60%,rgba(170,90,255,.15),transparent),radial-gradient(110px 110px at 28% 86%,rgba(255,138,43,.11),transparent),radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.2)),radial-gradient(70% 42% at 50% 30%,rgba(255,122,24,.13),transparent 72%),radial-gradient(55% 34% at 100% 100%,rgba(140,70,220,.16),transparent 72%),linear-gradient(180deg,rgba(70,35,120,.20),transparent 48%)}
body.hw::after{content:'';position:fixed;top:0;right:0;width:120px;height:120px;z-index:-1;pointer-events:none;opacity:.35;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20120%20120%27%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%23fff%27%20stroke-width%3D%271%27%3E%3Cpath%20d%3D%27M120%200L0%200M120%200L0%2036M120%200L14%2084M120%200L50%20118M120%200L120%20120%27%2F%3E%3Ccircle%20cx%3D%27120%27%20cy%3D%270%27%20r%3D%2730%27%2F%3E%3Ccircle%20cx%3D%27120%27%20cy%3D%270%27%20r%3D%2760%27%2F%3E%3Ccircle%20cx%3D%27120%27%20cy%3D%270%27%20r%3D%2790%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E") no-repeat top right/contain}
body.hw .pri,body.hw nav .plus{box-shadow:0 10px 26px -10px rgba(255,110,20,.75),inset 0 1px 0 rgba(255,255,255,.3)}
body.hw .opt.pri{background:linear-gradient(135deg,rgba(255,138,43,.26),rgba(140,70,220,.14));border-color:rgba(255,138,43,.5);box-shadow:0 14px 34px -18px rgba(255,110,20,.8),inset 0 1px 0 rgba(255,255,255,.12)}
body.hw .opt .oi{background:rgba(255,138,43,.14)}
body.hw .opt.pri .oi{background:var(--grad)}
body.hw nav button.on{background:rgba(255,138,43,.16)}

function deckFx(){const d=$('#deck');if(!d)return;const cs=[...d.children];if(!cs.length)return;const ref=d.scrollTop+24+cs[0].offsetHeight/2;let best=0,bd=1e9;
 cs.forEach((c,i)=>{const dist=Math.abs(c.offsetTop+c.offsetHeight/2-ref),n=Math.min(1,dist/(c.offsetHeight*.9));c.style.setProperty('--d',n.toFixed(3));c.style.zIndex=100-Math.round(n*100);if(dist<bd){bd=dist;best=i}});
 cs.forEach((c,i)=>c.classList.toggle('on',i===best));S.ai=best}

async function fromLogo(f){if(!f)return;readForm();const im=await loadImg(f);if(!im){toast('Nepavyko nuskaityti paveikslėlio');return}
 const n=160,c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d'),m=Math.min(im.width,im.height);

async function fromShot(f){
 if(!f)return;const inForm=S.view==='form';if(inForm)readForm();
 const d=inForm?S.draft:{merchantName:'',cardName:'',barcodeValue:'',barcodeType:'code_128',color:COL[0],icon:ICO[0],isFavorite:false,image:null,auto:true};
 const im=await loadImg(f);
 if(!im){toast('Nepavyko nuskaityti nuotraukos');return}
 const draw=m=>{const k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c};
 const big=draw(1600);let hit=null;
 try{if('BarcodeDetector' in window){const r=await new BarcodeDetector({formats:Object.keys(TYPES)}).detect(big);if(r.length)hit={v:r[0].rawValue,t:r[0].format}}}catch(e){}
 if(!hit&&typeof jsQR==='function'){const x=big.getContext('2d').getImageData(0,0,big.width,big.height),q=jsQR(x.data,x.width,x.height,{inversionAttempts:'attemptBoth'});if(q)hit={v:q.data,t:'qr_code'}}
 d.shot=draw(1200).toDataURL('image/jpeg',.85);
 if(hit){d.barcodeValue=hit.v;d.barcodeType=TYPES[hit.t]?hit.t:'qr_code';d.auto=false;d.useShot=true;toast('Kodas atpažintas')}
 else{d.useShot=true;toast('Kodo neatpažinau – rodysiu nuotrauką')}

async function importJson(f){if(!f)return;try{const a=JSON.parse(await f.text()),cs=Array.isArray(a)?a:(a&&a.cards)||[],ds=(a&&a.disc)||[];if(!Array.isArray(cs)||!Array.isArray(ds))throw 0;const ids=new Set(S.cards.map(c=>c.id)),dids=new Set(S.disc.map(c=>c.id));let n=0;
 for(const c of cs){if(c&&c.merchantName&&(c.barcodeValue||c.shot)&&!ids.has(c.id)){S.cards.push({...c,id:c.id||'c'+Date.now().toString(36)+n});n++}}
 for(const d of ds){if(d&&d.code&&(d.store||d.name)&&!dids.has(d.id)){S.disc.push({...d,id:d.id||'d'+Date.now().toString(36)+n});n++}}
 save();render();toast(T('Importuota kortelių: ')+n)}catch(e){toast('Netinkamas failas')}}

function guess(v){if(/^\d+$/.test(v)&&[8,12,13].includes(v.length)&&gsOk(v))return {8:'ean_8',12:'upc_a',13:'ean_13'}[v.length];return 'code_128'}
